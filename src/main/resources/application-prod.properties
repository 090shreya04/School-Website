# Database - TiDB Cloud (env vars set directly in Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/project1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Server
server.port=8080
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

spring.servlet.multipart.enabled=true
server.tomcat.max-parameter-count=1000
server.tomcat.max-multipart-file-count=1000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB