# Database - TiDB Cloud
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Server
server.port=8080
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

spring.servlet.multipart.enabled=true
server.tomcat.max-parameter-count=1000
server.tomcat.max-multipart-file-count=1000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB